<!DOCTYPE html>
<!-- Image de partage (Open Graph) 1200 × 630 : produite par share-image.mjs, EN LOCAL. Textes repris de la page d'accueil. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
    @font-face { font-family: Sora; src: url('../../public/fonts/sora-2.000-latin.woff2') format('woff2'); font-weight: 400 700; }
    * { box-sizing: border-box; margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; font-family: Sora, sans-serif; color: #fff;
           background: radial-gradient(circle at 85% 20%, rgba(255, 122, 26, .35), transparent 45%), linear-gradient(135deg, #0E2A5C 0%, #081A3D 100%); }
    .frame { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
    .logo { height: 72px; width: auto; align-self: flex-start; }
    h1 { max-width: 640px; font-size: 54px; line-height: 1.12; font-weight: 700; letter-spacing: -.01em; }
    h1 span { color: #FF7A1A; }
    .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 14px; padding: 16px 28px; border-radius: 999px; background: #FF7A1A; color: #0E2A5C; font-size: 28px; font-weight: 700; }
    .teacher { position: absolute; right: 72px; bottom: 64px; width: 380px; height: 380px; border-radius: 50%; overflow: hidden; background: #FF7A1A; border: 10px solid rgba(255, 255, 255, .15); }
    .teacher img { width: 100%; height: 100%; object-fit: cover; }
    .name { position: absolute; right: 72px; top: 76px; font-size: 26px; font-weight: 600; color: rgba(255, 255, 255, .85); }
</style>
</head>
<body>
    <div class="frame">
        <img class="logo" src="../../public/brand/logo-blanc.png" alt="">
        <h1>Parlez anglais avec un professeur <span>disponible chaque jour</span></h1>
        <div class="pill">Évaluation orale gratuite</div>
        <p class="name">Teacher Joe · Votre professeur d'anglais à l'oral</p>
        <div class="teacher"><img src="../../public/images/teacher-joe.webp" alt=""></div>
    </div>
</body>
</html>
