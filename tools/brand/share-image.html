<!DOCTYPE html>
<!-- Image de partage (Open Graph) 1200 × 630 : produite par share-image.mjs, EN LOCAL. Textes repris de la page d'accueil.
     WhatsApp montre souvent une petite vignette CARRÉE prise au centre (x 285 à 915) : logo, Teacher Joe et l'évaluation
     gratuite y tiennent ; le titre et le nom du professeur sont de part et d'autre, visibles dans le grand aperçu. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
    @font-face { font-family: Sora; src: url('../../public/fonts/sora-2.000-latin.woff2') format('woff2'); font-weight: 400 700; }
    * { box-sizing: border-box; margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; font-family: Sora, sans-serif; color: #fff; position: relative;
           background: radial-gradient(circle at 50% 42%, rgba(255, 122, 26, .30), transparent 38%), linear-gradient(135deg, #0E2A5C 0%, #081A3D 100%); }
    .center { position: absolute; left: 300px; width: 600px; top: 0; height: 630px; display: flex; flex-direction: column; align-items: center; }
    .logo { height: 64px; width: auto; margin-top: 46px; }
    .teacher { margin-top: 26px; width: 330px; height: 330px; border-radius: 50%; overflow: hidden; background: #FF7A1A; border: 10px solid rgba(255, 255, 255, .18); }
    .teacher img { width: 100%; height: 100%; object-fit: cover; }
    .pill { margin-top: 30px; padding: 16px 30px; border-radius: 999px; background: #FF7A1A; color: #0E2A5C; font-size: 30px; font-weight: 700; white-space: nowrap; }
    .left { position: absolute; left: 56px; top: 0; height: 630px; width: 230px; display: flex; align-items: center; }
    h1 { font-size: 46px; line-height: 1.12; font-weight: 700; letter-spacing: -.01em; }
    h1 span { color: #FF7A1A; }
    .right { position: absolute; right: 56px; top: 0; height: 630px; width: 230px; display: flex; align-items: center; text-align: right; }
    .right p { font-size: 27px; line-height: 1.3; font-weight: 600; color: rgba(255, 255, 255, .9); }
    .right strong { display: block; font-size: 34px; color: #fff; margin-bottom: 8px; }
</style>
</head>
<body>
    <div class="left"><h1>Parlez anglais <span>chaque jour</span></h1></div>
    <div class="center">
        <img class="logo" src="../../public/brand/logo-blanc.png" alt="">
        <div class="teacher"><img src="../../public/images/teacher-joe.webp" alt=""></div>
        <div class="pill">Évaluation orale gratuite</div>
    </div>
    <div class="right"><p><strong>Teacher Joe</strong>Votre professeur d'anglais à l'oral</p></div>
</body>
</html>
