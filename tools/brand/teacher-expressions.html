<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Expressions de Teacher Joe</title>
<style>
    html, body { margin: 0; background: #F4F6FB; }
    #stage { position: absolute; left: 0; top: 0; width: 576px; height: 576px; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Page ouverte par teacher-expressions.mjs (EN LOCAL) : le MÊME professeur 3D que les séances (salle de classe,
// lumières, personnage), en mode « vidéo » (image par image, hasard reproductible), cadré sur le visage. Chaque
// expression est jouée puis photographiée au moment où elle est pleinement installée, et réduite à la taille voulue.

function seeded(seed) {
    let a = seed >>> 0;

    return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

window.renderExpressions = async ({ names, size, quality, camera, settle }) => {
    const { createTeacher3D } = await import('/js/teacher-3d.js');
    const results = {};

    for (const name of names) {
        Math.random = seeded(4242);
        const stage = document.getElementById('stage');
        stage.innerHTML = '';
        const teacher = await createTeacher3D({
            container: stage,
            config: {
                video: true,
                scene: { mode: 'classroom' },
                antialias: true,
                lib: {
                    three: '/teacher3d/lib/three-teacher.min.js',
                    headaudio: '/teacher3d/lib/headaudio.min.js',
                    worklet: '/teacher3d/lib/headworklet.min.js',
                    lipsync: '/teacher3d/lib/lipsync-en.bin',
                },
                model: { url: '/teacher3d/models/teacher-joe.glb', size: 0, profile: 'teacher-joe', desk_height: 0.175, resting_smile: 0.3, camera },
            },
        });
        teacher.resize();

        // Repos, puis l'expression, photographiée quand elle est installée (avant son retour au repos).
        for (let i = 0; i < 20; i++) teacher.step(1 / 30);
        if (name !== 'neutral') teacher.expression(name);
        for (let i = 0; i < settle * 30; i++) teacher.step(1 / 30);

        const source = teacher.renderer.domElement;
        const out = document.createElement('canvas');
        out.width = size;
        out.height = size;
        const context = out.getContext('2d');
        context.imageSmoothingQuality = 'high';
        context.drawImage(source, 0, 0, size, size);
        results[name] = out.toDataURL('image/webp', quality);
        teacher.destroy?.();
    }

    return results;
};
window.ready = true;
</script>
</body>
</html>
