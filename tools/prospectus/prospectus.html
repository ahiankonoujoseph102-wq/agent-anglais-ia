<!doctype html>
<!-- Prospectus de la plateforme (A6) : texte NOIR sur papier BLANC, aucun fond plein, pour l'impression économique et la
     photocopie. Hiérarchie typographique, filets fins et contours seulement. Rempli par build.mjs (valeurs lues dans la
     configuration du site, code QR de qr.py). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Prospectus {{platform}}</title>
<style>
    @font-face { font-family: Sora; font-weight: 400; src: url('../../resources/pdf/sora-regular.ttf'); }
    @font-face { font-family: Sora; font-weight: 700; src: url('../../resources/pdf/sora-bold.ttf'); }
    @page { size: {{page_width}}mm {{page_height}}mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #fff; color: #000; font-family: Sora, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { width: {{page_width}}mm; height: {{page_height}}mm; position: relative; overflow: hidden; }
    svg.i { flex: none; fill: none; stroke: #000; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .flyer { position: absolute; width: 105mm; height: var(--h, 148mm); padding: 7mm 8mm 6mm; display: flex; flex-direction: column; }

    /* En-tête : logo, mention en petites capitales, double filet (épais puis fin) comme une page de titre. */
    .head { display: flex; align-items: flex-end; justify-content: space-between; }
    .logo { height: 9.5mm; display: block; }
    .head-note { font-size: 5.6pt; line-height: 1.5; text-align: right; font-weight: 700; letter-spacing: 0.9pt; text-transform: uppercase; }
    .rules { margin-top: 2.6mm; border-top: 0.45mm solid #000; padding-top: 0.5mm; }
    .rules::after { content: ''; display: block; border-top: 0.12mm solid #000; }

    .kicker { margin-top: 3.4mm; font-size: 7.4pt; line-height: 1.35; letter-spacing: 0.1pt; }
    h1 { margin-top: 1.1mm; font-size: 16.8pt; line-height: 1.1; font-weight: 700; letter-spacing: -0.35pt; }

    /* Quatre atouts en deux colonnes, séparés par des filets fins. */
    ul { list-style: none; margin: 3mm 0 4.6mm; display: grid; grid-template-columns: 1fr 1fr; border-top: 0.12mm solid #000; }
    li { display: flex; align-items: center; gap: 1.8mm; padding: 1.7mm 1mm 1.7mm 0; font-size: 7.1pt; white-space: nowrap; line-height: 1.25; border-bottom: 0.12mm solid #000; }
    li:nth-child(even) { padding-left: 2.6mm; border-left: 0.12mm solid #000; }
    li svg { width: 4mm; height: 4mm; }

    /* Encadré de l'appel : contour fin, étiquette « GRATUIT » posée sur le filet du haut. */
    .cta { position: relative; margin-top: auto; border: 0.35mm solid #000; border-radius: 2.4mm; padding: 3.6mm 3mm 0; }
    .tag { position: absolute; top: 0; left: 3mm; transform: translateY(-50%); background: #fff; padding: 0 1.6mm; font-size: 7.6pt; font-weight: 700; letter-spacing: 1.8pt; }
    .cta-main { display: flex; gap: 3.2mm; align-items: center; }
    .qr { width: 33mm; height: 33mm; flex: none; display: block; shape-rendering: crispEdges; }
    .cta-text { display: flex; flex-direction: column; min-width: 0; }
    .cta-title { font-size: 12pt; line-height: 1.12; font-weight: 700; letter-spacing: -0.15pt; }
    .cta-sub { margin-top: 1.4mm; font-size: 7.2pt; line-height: 1.35; }
    .scan { margin-top: 2.6mm; padding-top: 2mm; border-top: 0.12mm solid #000; display: flex; gap: 1.6mm; align-items: center; font-size: 6.8pt; line-height: 1.3; }
    .scan svg { width: 3.6mm; height: 3.6mm; }
    .fallback { margin: 2.6mm -3mm 0; padding: 1.8mm 3mm 2mm; border-top: 0.12mm dashed #000; font-size: 7pt; line-height: 1.3; text-align: center; }
    .fallback span { display: block; }
    .fallback strong { font-size: 10pt; letter-spacing: -0.1pt; white-space: nowrap; }

    .price { margin-top: 2.5mm; text-align: center; font-size: 7.2pt; line-height: 1.35; white-space: nowrap; }
    .price strong { font-weight: 700; }

    /* Coordonnées : titre en petites capitales entre deux filets, puis trois lignes. */
    .contact { margin-top: 2.4mm; }
    .label { display: flex; align-items: center; gap: 2mm; font-size: 5.6pt; font-weight: 700; letter-spacing: 1.4pt; text-transform: uppercase; }
    .label::before, .label::after { content: ''; flex: 1; border-top: 0.12mm solid #000; }
    .lines { margin-top: 1.7mm; display: grid; gap: 1.1mm; font-size: 7.2pt; line-height: 1.3; }
    .line { display: flex; align-items: center; gap: 2mm; }
    .line svg { width: 3.5mm; height: 3.5mm; }
    .line strong { font-weight: 700; }
    .line .note { font-size: 6.2pt; }
    .ref { position: absolute; right: 8mm; bottom: 2.4mm; font-size: 5pt; color: #555; }

    /* Feuille A4 : traits de coupe discrets (petits traits dans la marge et pointillés très clairs sur la coupe). */
    .cut { position: absolute; background: #000; }
    .guide { position: absolute; border-color: #b5b5b5; border-style: dashed; border-width: 0; }
</style>
</head>
<body>
<template id="flyer">
    <div class="flyer">
        <div class="head">
            <img class="logo" src="logo-noir.png" alt="{{platform}}">
            <p class="head-note">Cours d'anglais à l'oral<br>Lomé · Togo</p>
        </div>
        <div class="rules"></div>
        <p class="kicker">Êtes-vous vraiment fier de votre niveau en anglais&#8239;?</p>
        <h1>Parlez anglais avec {{teacher_nb}}, chaque jour.</h1>
        <ul>
            <li><svg class="i" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg><span>À voix haute, sans gêne</span></li>
            <li><svg class="i" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg><span>Sur votre téléphone</span></li>
            <li><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg><span>Vos erreurs corrigées</span></li>
            <li><svg class="i" viewBox="0 0 24 24"><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/><path d="M12 5v16"/></svg><span>Aide aux cours d'anglais</span></li>
        </ul>

        <div class="cta">
            <span class="tag">GRATUIT</span>
            <div class="cta-main">
                {{qr}}
                <div class="cta-text">
                    <p class="cta-title">Évaluation orale de {{minutes}}&nbsp;minutes</p>
                    <p class="cta-sub">Découvrez votre niveau d'anglais, de A1&nbsp;à&nbsp;C2.</p>
                    <p class="scan"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span>Scannez le code avec l'appareil photo de votre téléphone.</span></p>
                </div>
            </div>
            <p class="fallback"><span>Le code ne fonctionne pas&#8239;?</span> Tapez <strong>{{site}}</strong> dans votre navigateur.</p>
        </div>

        <p class="price"><strong>Formules à partir de {{price}}&nbsp;FCFA {{period}}</strong> · Mobile Money</p>

        <div class="contact">
            <p class="label">Nous contacter</p>
            <div class="lines">
                <p class="line"><svg class="i" viewBox="0 0 24 24"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg><span><strong>{{phone}}</strong> &nbsp;·&nbsp; <strong>{{phone2}}</strong> <span class="note">(appel ou WhatsApp)</span></span></p>
                <p class="line"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span>{{email}}</span></p>
                <p class="line"><svg class="i" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span>{{address}}</span></p>
            </div>
        </div>
        {{ref}}
    </div>
</template>
<script>
    // Pose les prospectus sur la page : un seul (A6), ou quatre sur une feuille A4 avec les traits de coupe.
    const layout = {{layout}};
    const tpl = document.getElementById('flyer');
    for (const [x, y] of layout.cells) {
        const node = tpl.content.firstElementChild.cloneNode(true);
        node.style.left = x + 'mm';
        node.style.top = y + 'mm';
        node.style.setProperty('--h', layout.cellHeight + 'mm');
        document.body.appendChild(node);
    }
    const mark = (cls, css) => { const el = document.createElement('div'); el.className = cls; Object.assign(el.style, css); document.body.appendChild(el); };
    if (layout.sheet) {
        const W = layout.width, H = layout.height, cx = W / 2, cy = H / 2, t = 0.2, from = 3, len = 5;
        // Petits traits noirs dans la marge, au bout de chaque ligne de coupe.
        for (const top of [from, H - from - len]) mark('cut', { left: (cx - t / 2) + 'mm', top: top + 'mm', width: t + 'mm', height: len + 'mm' });
        for (const left of [from, W - from - len]) mark('cut', { top: (cy - t / 2) + 'mm', left: left + 'mm', height: t + 'mm', width: len + 'mm' });
        // Pointillés très clairs sur toute la coupe, pour couper aux ciseaux.
        mark('guide', { left: cx + 'mm', top: (from + len + 1) + 'mm', height: (H - 2 * (from + len + 1)) + 'mm', borderLeftWidth: '0.15mm' });
        mark('guide', { top: cy + 'mm', left: (from + len + 1) + 'mm', width: (W - 2 * (from + len + 1)) + 'mm', borderTopWidth: '0.15mm' });
    }
</script>
</body>
</html>
