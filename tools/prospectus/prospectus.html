<!doctype html>
<!-- Prospectus de la plateforme (A6) : texte NOIR sur papier BLANC, aucun fond plein, pour l'impression économique et la
     photocopie. Rempli par build.mjs (valeurs lues dans la configuration du site, code QR de qr.py). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Prospectus {{platform}}</title>
<style>
    @font-face { font-family: Sora; font-weight: 400; src: url('../../resources/pdf/sora-regular.ttf'); }
    @font-face { font-family: Sora; font-weight: 700; src: url('../../resources/pdf/sora-bold.ttf'); }
    @page { size: {{page_width}}mm {{page_height}}mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #fff; color: #000; font-family: Sora, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { width: {{page_width}}mm; height: {{page_height}}mm; position: relative; overflow: hidden; }

    .flyer { position: absolute; width: 105mm; height: var(--h, 148mm); padding: 7mm 7.5mm 6.5mm; display: flex; flex-direction: column; }
    .head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 3mm; border-bottom: 0.35mm solid #000; }
    .logo { height: 10.5mm; display: block; }
    .head-note { font-size: 7.2pt; line-height: 1.25; text-align: right; font-weight: 700; }

    .kicker { margin-top: 3.6mm; font-size: 8.2pt; line-height: 1.3; }
    h1 { margin-top: 1.4mm; font-size: 19pt; line-height: 1.12; font-weight: 700; letter-spacing: -0.2pt; }

    ul { list-style: none; margin-top: 4mm; display: grid; gap: 2.3mm; }
    li { display: flex; align-items: center; gap: 2.6mm; font-size: 8.8pt; line-height: 1.25; }
    li svg { width: 5mm; height: 5mm; flex: none; fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .cta { margin-top: auto; border: 0.6mm solid #000; border-radius: 3mm; padding: 2.6mm; display: flex; gap: 3mm; align-items: center; }
    .qr { width: 37mm; height: 37mm; flex: none; display: block; shape-rendering: crispEdges; }
    .cta-text { display: flex; flex-direction: column; gap: 1.3mm; min-width: 0; }
    .pill { align-self: flex-start; border: 0.4mm solid #000; border-radius: 10mm; padding: 0.5mm 2.4mm; font-size: 7.4pt; font-weight: 700; letter-spacing: 0.6pt; }
    .cta-title { font-size: 12.6pt; line-height: 1.12; font-weight: 700; }
    .cta-sub { font-size: 7.6pt; line-height: 1.3; }
    .site { font-size: 15pt; font-weight: 700; letter-spacing: -0.2pt; line-height: 1; }

    .foot { margin-top: 3.2mm; display: grid; gap: 1.4mm; font-size: 8pt; line-height: 1.3; }
    .foot strong { font-weight: 700; }
    .foot .line { display: flex; align-items: center; gap: 1.8mm; }
    .foot svg { width: 3.6mm; height: 3.6mm; flex: none; fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ref { position: absolute; right: 7.5mm; bottom: 2.6mm; font-size: 5.5pt; color: #555; }

    /* Feuille A4 : traits de coupe discrets (petits traits dans la marge et pointillés très clairs sur la coupe). */
    .cut { position: absolute; background: #000; }
    .guide { position: absolute; border-color: #b5b5b5; border-style: dashed; border-width: 0; }
</style>
</head>
<body>
<template id="flyer">
    <div class="flyer">
        <div class="head">
            <img class="logo" src="logo-noir.png" alt="{{platform}}">
            <p class="head-note">Cours d'anglais<br>à l'oral</p>
        </div>
        <p class="kicker">Êtes-vous vraiment fier de votre niveau en anglais&#8239;?</p>
        <h1>Parlez anglais avec {{teacher_nb}}, chaque jour.</h1>
        <ul>
            <li><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>Vous parlez anglais à voix haute, sans gêne</li>
            <li><svg viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>Depuis votre téléphone, à l'heure qui vous arrange</li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>{{teacher}} vous écoute et corrige vos erreurs</li>
            <li><svg viewBox="0 0 24 24"><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/><path d="M12 5v16"/></svg>Aide aussi pour vos cours d'anglais</li>
        </ul>
        <div class="cta">
            {{qr}}
            <div class="cta-text">
                <span class="pill">GRATUIT</span>
                <p class="cta-title">Évaluation orale de {{minutes}}&nbsp;minutes</p>
                <p class="cta-sub">Votre niveau, de A1&nbsp;à&nbsp;C2.</p>
                <p class="cta-sub">Scannez le code ou allez sur&nbsp;:</p>
                <p class="site">{{site}}</p>
            </div>
        </div>
        <div class="foot">
            <p class="line"><svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span><strong>Formules à partir de {{price}}&nbsp;FCFA {{period}}</strong><br>Paiement par Mobile Money</span></p>
            <p class="line"><svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.2-4.2A8.5 8.5 0 1 1 20.5 12z"/><path d="M9 8.5c0 3.6 2.9 6.5 6.5 6.5l1-1.6-2-1-1 1a4 4 0 0 1-2.4-2.4l1-1-1-2z"/></svg><span>Une question&#8239;? Appel ou WhatsApp&#8239;: <strong>{{phone}}</strong></span></p>
        </div>
        {{ref}}
    </div>
</template>
<script>
    // Pose les prospectus sur la page : un seul (A6), ou quatre sur une feuille A4 avec les traits de coupe.
    const layout = {{layout}};
    const tpl = document.getElementById('flyer');
    for (const [x, y] of layout.cells) {
        const node = tpl.content.firstElementChild.cloneNode(true);
        node.style.left = x + 'mm';
        node.style.top = y + 'mm';
        node.style.setProperty('--h', layout.cellHeight + 'mm');
        document.body.appendChild(node);
    }
    const mark = (cls, css) => { const el = document.createElement('div'); el.className = cls; Object.assign(el.style, css); document.body.appendChild(el); };
    if (layout.sheet) {
        const W = layout.width, H = layout.height, cx = W / 2, cy = H / 2, t = 0.2, from = 3, len = 5;
        // Petits traits noirs dans la marge, au bout de chaque ligne de coupe.
        for (const top of [from, H - from - len]) mark('cut', { left: (cx - t / 2) + 'mm', top: top + 'mm', width: t + 'mm', height: len + 'mm' });
        for (const left of [from, W - from - len]) mark('cut', { top: (cy - t / 2) + 'mm', left: left + 'mm', height: t + 'mm', width: len + 'mm' });
        // Pointillés très clairs sur toute la coupe, pour couper aux ciseaux.
        mark('guide', { left: cx + 'mm', top: (from + len + 1) + 'mm', height: (H - 2 * (from + len + 1)) + 'mm', borderLeftWidth: '0.15mm' });
        mark('guide', { top: cy + 'mm', left: (from + len + 1) + 'mm', width: (W - 2 * (from + len + 1)) + 'mm', borderTopWidth: '0.15mm' });
    }
</script>
</body>
</html>
