# Vidéos de leçon de Teacher Joe : fabrication (Chromium sans écran + ffmpeg) des vidéos dont la voix est prête sur
# Talkami, puis dépôt dans le bucket privé. Deux passages par jour, et à la demande (Actions, Run workflow).
# Deux travaux en parallèle : la vidéo du Club des abonnés (seule, plus de temps), puis les vidéos de promotion.
# Secret : TALKAMI_VIDEO_TOKEN ; variable : TALKAMI_URL (Settings, Secrets and variables, Actions).
name: Vidéos de Teacher Joe

on:
  schedule:
    # 6 heures 30 et 10 heures 30, heure de Lomé (UTC) : après la préparation du matin (4 heures 40).
    - cron: '30 6 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Nombre de vidéos de promotion à fabriquer (la vidéo du Club a son propre travail)'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      partie:
        description: 'Ce qu''il faut fabriquer'
        type: choice
        options: ['tout', 'club']
        default: 'tout'
      essai:
        description: 'Numéro de l''essai (relance automatique du Club après une machine trop lente)'
        type: string
        default: '1'

# Un passage « Club seulement » (relance automatique) n'attend pas la fin des vidéos de promotion du passage en cours.
concurrency:
  group: videos-${{ inputs.partie || 'tout' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  club:
    runs-on: ubuntu-latest
    # Vidéo du Club (3 minutes, rendu allégé : 396 × 704, 20 images par seconde) : environ 8 minutes sur une machine
    # rapide, 15 sur le dépôt privé, 55 sur une machine lente. Certaines machines de GitHub sont 7 fois plus lentes :
    # après 250 images, render.mjs calcule la fin ; si elle dépasse 72 minutes, il s'arrête, rend la vidéo à Talkami
    # et un nouveau passage « Club seulement » est lancé aussitôt (autre machine), 3 essais au plus.
    timeout-minutes: 80
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public
            tools/video
            resources/pdf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Combien de vidéos attendent ?
        id: peek
        working-directory: tools/video
        env:
          TALKAMI_URL: ${{ vars.TALKAMI_URL }}
          TALKAMI_VIDEO_TOKEN: ${{ secrets.TALKAMI_VIDEO_TOKEN }}
          VIDEO_KIND: club
          VIDEO_PEEK: '1'
        run: |
          npm install --no-audit --no-fund --silent
          node render.mjs

      - name: Installer ffmpeg
        if: steps.peek.outputs.waiting != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Fabriquer les vidéos
        if: steps.peek.outputs.waiting != '0'
        working-directory: tools/video
        env:
          TALKAMI_URL: ${{ vars.TALKAMI_URL }}
          TALKAMI_VIDEO_TOKEN: ${{ secrets.TALKAMI_VIDEO_TOKEN }}
          VIDEO_KIND: club
          VIDEO_COUNT: '1'
          VIDEO_BUDGET_MINUTES: '72'
          CHROME_PATH: /usr/bin/google-chrome
        id: make
        run: node render.mjs

      - name: Relancer sur une autre machine
        if: steps.make.outputs.released == '1' && fromJSON(inputs.essai || '1') < 3
        env:
          GH_TOKEN: ${{ github.token }}
          ESSAI: ${{ inputs.essai || '1' }}
        run: |
          gh workflow run videos.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f partie=club -f count=1 -f essai=$((ESSAI + 1))
          echo "Machine trop lente : nouveau passage « Club seulement » lancé (essai $((ESSAI + 1)) sur 3)."

  promotion:
    if: (inputs.partie || 'tout') != 'club'
    runs-on: ubuntu-latest
    # Limite d'un passage : 50 minutes. render.mjs ne commence pas une vidéo qu'il n'aurait pas le temps de finir
    # (VIDEO_BUDGET_MINUTES) : elle attend le passage suivant.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public
            tools/video
            resources/pdf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Combien de vidéos attendent ?
        id: peek
        working-directory: tools/video
        env:
          TALKAMI_URL: ${{ vars.TALKAMI_URL }}
          TALKAMI_VIDEO_TOKEN: ${{ secrets.TALKAMI_VIDEO_TOKEN }}
          VIDEO_KIND: promo
          VIDEO_PEEK: '1'
        run: |
          npm install --no-audit --no-fund --silent
          node render.mjs

      - name: Installer ffmpeg
        if: steps.peek.outputs.waiting != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Fabriquer les vidéos
        if: steps.peek.outputs.waiting != '0'
        working-directory: tools/video
        env:
          TALKAMI_URL: ${{ vars.TALKAMI_URL }}
          TALKAMI_VIDEO_TOKEN: ${{ secrets.TALKAMI_VIDEO_TOKEN }}
          VIDEO_KIND: promo
          VIDEO_COUNT: ${{ inputs.count || '1' }}
          VIDEO_BUDGET_MINUTES: '42'
          CHROME_PATH: /usr/bin/google-chrome
        run: node render.mjs
